<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线刷题系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50 !important;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .question-card {
            min-height: 400px;
        }
        .question-type {
            font-size: 14px;
            color: #6c757d;
        }
        .option-item {
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-item:hover {
            border-color: #3498db;
            background-color: #f8f9fa;
        }
        .option-item.selected {
            border-color: #3498db;
            background-color: #e8f4fd;
        }
        .option-item.correct {
            border-color: #28a745;
            background-color: #d4edda;
        }
        .option-item.wrong {
            border-color: #dc3545;
            background-color: #f8d7da;
        }
        .btn-submit {
            background-color: #3498db;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .btn-submit:disabled {
            background-color: #95a5a6;
        }
        .stats-card {
            text-align: center;
            padding: 20px;
        }
        .stats-number {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
        .stats-label {
            color: #6c757d;
            font-size: 14px;
        }
        .progress-custom {
            height: 8px;
            border-radius: 4px;
        }
        .modal-explanation {
            text-align: left;
        }
        .explanation-text {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .type-badge {
            font-size: 12px;
            padding: 4px 10px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-journal-bookmark-fill me-2"></i>在线刷题系统
            </a>
            <div class="d-flex">
                <a href="/wrongbook" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-exclamation-circle me-1"></i>错题本
                </a>
                <button class="btn btn-outline-light btn-sm" onclick="showStats()">
                    <i class="bi bi-bar-chart me-1"></i>统计
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container mt-4">
        <div class="row">
            <!-- 左侧：题目卡片 -->
            <div class="col-lg-8">
                <div class="card question-card" id="questionCard">
                    <!-- 题目内容区 -->
                    <div class="card-body" id="questionArea">
                        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：统计卡片 -->
            <div class="col-lg-4">
                <!-- 进度卡片 -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title text-muted mb-3">
                            <i class="bi bi-graph-up me-1"></i>刷题进度
                        </h6>
                        <div class="progress progress-custom mb-2">
                            <div class="progress-bar bg-primary" id="progressBar" style="width: 0%"></div>
                        </div>
                        <small class="text-muted">
                            已完成 <span id="answeredCount">0</span> / <span id="totalCount">0</span> 题
                        </small>
                    </div>
                </div>

                <!-- 统计卡片 -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6 stats-card">
                                <div class="stats-number" id="correctRate">0%</div>
                                <div class="stats-label">正确率</div>
                            </div>
                            <div class="col-6 stats-card">
                                <div class="stats-number" id="wrongCount">0</div>
                                <div class="stats-label">错题数</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 题型分布 -->
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title text-muted mb-3">
                            <i class="bi bi-pie-chart me-1"></i>题型分布
                        </h6>
                        <div class="d-flex justify-content-between mb-2">
                            <span>单选题</span>
                            <span id="singleCount">0 / 120</span>
                        </div>
                        <div class="progress progress-custom mb-3">
                            <div class="progress-bar bg-primary" id="singleProgress" style="width: 0%"></div>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>多选题</span>
                            <span id="multiCount">0 / 10</span>
                        </div>
                        <div class="progress progress-custom mb-3">
                            <div class="progress-bar bg-success" id="multiProgress" style="width: 0%"></div>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>判断题</span>
                            <span id="judgeCount">0 / 30</span>
                        </div>
                        <div class="progress progress-custom">
                            <div class="progress-bar bg-info" id="judgeProgress" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="card mt-3">
                    <div class="card-body">
                        <button class="btn btn-outline-danger w-100 mb-2" onclick="clearDatabase()">
                            <i class="bi bi-trash me-1"></i>清空题库
                        </button>
                        <button class="btn btn-outline-secondary w-100 mb-2" onclick="resetProgress()">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>重置进度
                        </button>
                        <button class="btn btn-outline-warning w-100" onclick="importQuestions()">
                            <i class="bi bi-cloud-arrow-up me-1"></i>刷新题库
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 答案提示弹窗 -->
    <div class="modal fade" id="resultModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="resultTitle">
                        <i class="bi bi-check-circle text-success me-2"></i>回答正确
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body modal-explanation">
                    <div id="resultMessage"></div>
                    <div class="explanation-text mt-3" id="explanationArea" style="display:none;">
                        <h6><i class="bi bi-lightbulb me-1"></i>解析</h6>
                        <p id="explanationText" class="mb-0"></p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary" onclick="nextQuestion()">
                        下一题 <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 统计弹窗 -->
    <div class="modal fade" id="statsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-bar-chart me-2"></i>刷题统计
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row text-center">
                        <div class="col-4">
                            <div class="stats-number text-primary" id="modalTotal">0</div>
                            <div class="stats-label">总题库</div>
                        </div>
                        <div class="col-4">
                            <div class="stats-number text-success" id="modalCorrect">0</div>
                            <div class="stats-label">正确数</div>
                        </div>
                        <div class="col-4">
                            <div class="stats-number text-danger" id="modalWrong">0</div>
                            <div class="stats-label">错题数</div>
                        </div>
                    </div>
                    <hr>
                    <div class="text-center">
                        <div class="stats-number" id="modalAccuracy">0%</div>
                        <div class="stats-label">正确率</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentQuestion = null;
        let selectedAnswer = null;
        let resultModal = null;
        let statsModal = null;

        document.addEventListener('DOMContentLoaded', function() {
            resultModal = new bootstrap.Modal(document.getElementById('resultModal'));
            statsModal = new bootstrap.Modal(document.getElementById('statsModal'));
            initApp();
        });

        async function initApp() {
            showLoading();

            // 检查是否已导入题库
            const checkRes = await fetch('/api/import/check');
            const checkData = await checkRes.json();

            if (!checkData.imported) {
                showEmpty('题库未导入，请点击右上角"导入题库"按钮');
                return;
            }

            // 初始化会话
            await fetch('/api/init', { method: 'POST' });

            // 获取统计数据
            await updateStats();

            // 获取第一题
            await loadNextQuestion();
        }

        function showLoading() {
            document.getElementById('questionArea').innerHTML = `
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                </div>
            `;
        }

        function showEmpty(message) {
            document.getElementById('questionArea').innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h5>${message}</h5>
                </div>
            `;
        }

        async function loadNextQuestion() {
            showLoading();

            const res = await fetch('/api/question/next');
            const data = await res.json();

            if (!data.success) {
                showComplete();
                return;
            }

            currentQuestion = data.question;
            selectedAnswer = null;

            renderQuestion(currentQuestion);
            await updateStats();
        }

        function renderQuestion(question) {
            const optionsHtml = Object.entries(question.options).map(([key, value]) => `
                <div class="option-item" data-option="${key}" onclick="selectOption('${key}')">
                    <strong>${key}.</strong> ${value}
                </div>
            `).join('');

            document.getElementById('questionArea').innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-secondary type-badge">${question.type_name}</span>
                </div>
                <h5 class="mb-4">${question.content}</h5>
                <div class="options-container">
                    ${optionsHtml}
                </div>
                <div class="mt-4 text-center">
                    <button class="btn btn-submit btn-primary" onclick="submitAnswer()" id="submitBtn" disabled>
                        确认答案
                    </button>
                </div>
            `;
        }

        function selectOption(option) {
            // 移除之前的选中状态
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('selected');
            });

            // 选中新选项
            const optionEl = document.querySelector(`[data-option="${option}"]`);
            if (optionEl) {
                optionEl.classList.add('selected');
                selectedAnswer = option;

                // 多选题支持多选
                if (currentQuestion.type === 'multi') {
                    optionEl.classList.toggle('selected');
                    // 收集所有选中的选项
                    const selected = [];
                    document.querySelectorAll('.option-item.selected').forEach(el => {
                        selected.push(el.dataset.option);
                    });
                    selectedAnswer = selected.sort().join('');
                }
            }

            document.getElementById('submitBtn').disabled = false;
        }

        async function submitAnswer() {
            if (!selectedAnswer || !currentQuestion) return;

            const res = await fetch('/api/answer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question_id: currentQuestion.id,
                    answer: selectedAnswer
                })
            });

            const data = await res.json();

            if (data.is_correct) {
                await updateStats();
                await loadNextQuestion();
            } else {
                document.getElementById('resultTitle').innerHTML =
                    '<i class="bi bi-x-circle text-danger me-2"></i>回答错误';
                document.getElementById('resultMessage').innerHTML = `
                    <p class="text-danger">正确答案是：<strong>${data.correct_answer}</strong></p>
                    <p>你的答案是：<strong>${data.user_answer}</strong></p>
                `;
                document.getElementById('explanationText').textContent =
                    data.explanation || '暂无解析';
                document.getElementById('explanationArea').style.display = 'block';
                document.getElementById('resultModal').querySelector('.btn-primary').disabled = false;
                resultModal.show();
                updateStats();
            }
        }

        function nextQuestion() {
            document.getElementById('explanationArea').style.display = 'none';
            resultModal.hide();
            loadNextQuestion();
        }

        function showComplete() {
            document.getElementById('questionArea').innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-trophy text-warning"></i>
                    <h5>恭喜！题目已全部完成！</h5>
                    <p class="text-muted">你已经完成了所有题目的练习</p>
                    <button class="btn btn-primary mt-3" onclick="resetProgress()">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>重新开始
                    </button>
                </div>
            `;
        }

        async function updateStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();

            if (data.success) {
                const stats = data.stats;
                const targets = data.type_targets;
                const actual = data.actual_counts;
                const progress = data.session_progress;

                // 更新总进度
                document.getElementById('answeredCount').textContent = progress.answered;
                document.getElementById('totalCount').textContent = targets.total || 0;

                const progressPercent = targets.total > 0
                    ? (progress.answered / targets.total * 100).toFixed(1)
                    : 0;
                document.getElementById('progressBar').style.width = progressPercent + '%';

                // 更新正确率
                document.getElementById('correctRate').textContent = stats.accuracy + '%';
                document.getElementById('wrongCount').textContent = stats.wrong_count;

                // 更新题型分布（显示实际题目数量）
                document.getElementById('singleCount').textContent =
                    `${actual.single} 道`;
                document.getElementById('singleProgress').style.width = '100%';

                document.getElementById('multiCount').textContent =
                    `${actual.multi} 道`;
                document.getElementById('multiProgress').style.width = '100%';

                document.getElementById('judgeCount').textContent =
                    `${actual.judge} 道`;
                document.getElementById('judgeProgress').style.width = '100%';
            }
        }

        async function resetProgress() {
            if (!confirm('确定要重置刷题进度吗？')) return;

            await fetch('/api/reset', { method: 'POST' });
            await loadNextQuestion();
        }

        async function clearDatabase() {
            if (!confirm('确定要清空题库吗？所有题目、进度和错题记录都将被删除！')) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>清空中...';

            const res = await fetch('/api/clear', { method: 'POST' });
            const data = await res.json();

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trash me-1"></i>清空题库';

            if (data.success) {
                alert('已清空所有数据！');
                location.reload();
            } else {
                alert('清空失败：' + data.message);
            }
        }

        async function importQuestions() {
            if (!confirm('将重新导入理论目录中的题库，现有数据将被覆盖，是否继续？')) return;

            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>导入中...';

            const res = await fetch('/api/import', { method: 'POST' });
            const data = await res.json();

            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-1"></i>刷新题库';

            if (data.success) {
                alert(`导入成功！共 ${data.statistics.total} 道题目\n单选题: ${data.statistics.single} | 多选题: ${data.statistics.multi} | 判断题: ${data.statistics.judge}`);
                location.reload();
            } else {
                alert('导入失败：' + data.message);
            }
        }

        function showStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const stats = data.stats;
                        document.getElementById('modalTotal').textContent = stats.total_questions;
                        document.getElementById('modalCorrect').textContent = stats.correct_count;
                        document.getElementById('modalWrong').textContent = stats.wrong_count;
                        document.getElementById('modalAccuracy').textContent = stats.accuracy + '%';
                        statsModal.show();
                    }
                });
        }
    </script>
</body>
</html>
