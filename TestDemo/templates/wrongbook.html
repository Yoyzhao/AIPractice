<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 - 在线刷题系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50 !important;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .question-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .question-content {
            font-size: 15px;
            line-height: 1.6;
        }
        .answer-section {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .your-answer {
            color: #dc3545;
        }
        .correct-answer {
            color: #28a745;
        }
        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .btn-retry {
            background-color: #3498db;
            border: none;
        }
        .btn-retry:hover {
            background-color: #2980b9;
        }
        .btn-remove {
            background-color: #28a745;
            border: none;
        }
        .btn-remove:hover {
            background-color: #218838;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state i {
            font-size: 80px;
            color: #dee2e6;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .wrong-count-badge {
            background-color: #dc3545;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-journal-bookmark-fill me-2"></i>错题本
            </a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-arrow-left me-1"></i>返回刷题
                </a>
                <button class="btn btn-outline-light btn-sm" onclick="cleanWrongbook()">
                    <i class="bi bi-trash me-1"></i>清空错题
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container mt-4">
        <!-- 统计栏 -->
        <div class="stats-bar">
            <div>
                <span class="text-muted">错题总数：</span>
                <span class="wrong-count-badge" id="wrongCountBadge">0</span>
            </div>
            <div>
                <button class="btn btn-primary btn-sm" onclick="practiceAll()">
                    <i class="bi bi-play me-1"></i>全部重练
                </button>
            </div>
        </div>

        <!-- 错题列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-exclamation-circle text-danger me-2"></i>错题列表
                </h5>
            </div>
            <div class="card-body p-0" id="wrongbookList">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <!-- 答题弹窗 -->
    <div class="modal fade" id="practiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <span id="practiceType" class="badge bg-secondary me-2">单选题</span>
                        错题重练
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="practiceQuestion"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="submitPracticeAnswer()">
                        提交答案
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal fade" id="resultModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="resultTitle">
                        <i class="bi bi-check-circle text-success me-2"></i>回答正确
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="resultMessage"></div>
                    <div class="explanation-box mt-3" id="explanationArea" style="display:none;">
                        <h6><i class="bi bi-lightbulb me-1"></i>解析</h6>
                        <p id="explanationText" class="mb-0"></p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        返回错题本
                    </button>
                    <button type="button" class="btn btn-primary" onclick="continuePractice()">
                        继续练习 <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let wrongbook = [];
        let currentPractice = null;
        let selectedAnswer = null;
        let practiceModal = null;
        let resultModal = null;

        document.addEventListener('DOMContentLoaded', function() {
            practiceModal = new bootstrap.Modal(document.getElementById('practiceModal'));
            resultModal = new bootstrap.Modal(document.getElementById('resultModal'));
            loadWrongbook();
        });

        async function loadWrongbook() {
            const res = await fetch('/api/wrongbook');
            const data = await res.json();

            if (data.success && data.questions.length > 0) {
                wrongbook = data.questions;
                renderWrongbook();
            } else {
                renderEmpty();
            }

            document.getElementById('wrongCountBadge').textContent = data.count || 0;
        }

        function renderWrongbook() {
            const container = document.getElementById('wrongbookList');

            if (wrongbook.length === 0) {
                renderEmpty();
                return;
            }

            const itemsHtml = wrongbook.map((item, index) => `
                <div class="question-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <span class="badge bg-secondary me-2">${item.type_name}</span>
                            <span class="text-muted small">错误次数：${item.wrong_count}</span>
                        </div>
                    </div>
                    <div class="question-content mt-2">
                        <strong>${index + 1}.</strong> ${item.content}
                    </div>
                    <div class="answer-section">
                        <div><span class="your-answer">你的答案：${item.user_answer}</span></div>
                        <div><span class="correct-answer">正确答案：${item.correct_answer}</span></div>
                    </div>
                    ${item.explanation ? `
                        <div class="explanation-box">
                            <i class="bi bi-lightbulb me-1"></i>
                            <strong>解析：</strong>${item.explanation}
                        </div>
                    ` : ''}
                    <div class="mt-3">
                        <button class="btn btn-retry btn-sm text-white me-2" onclick="practiceQuestion(${item.question_id})">
                            <i class="bi bi-arrow-clockwise me-1"></i>重新答题
                        </button>
                        <button class="btn btn-remove btn-sm text-white" onclick="removeQuestion(${item.question_id})">
                            <i class="bi bi-check-lg me-1"></i>已掌握
                        </button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = itemsHtml;
        }

        function renderEmpty() {
            document.getElementById('wrongbookList').innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-check-circle"></i>
                    <h5 class="text-muted">太棒了！没有错题！</h5>
                    <p class="text-muted">继续保持，去刷更多题目吧</p>
                    <a href="/" class="btn btn-primary mt-3">
                        <i class="bi bi-arrow-left me-1"></i>返回刷题
                    </a>
                </div>
            `;
        }

        async function practiceQuestion(questionId) {
            const res = await fetch(`/api/question/${questionId}`);
            const data = await res.json();

            if (data.success) {
                currentPractice = data.question;
                selectedAnswer = null;
                renderPracticeQuestion();
                practiceModal.show();
            }
        }

        function renderPracticeQuestion() {
            const typeNames = {'single': '单选题', 'multi': '多选题', 'judge': '判断题'};
            document.getElementById('practiceType').textContent = typeNames[currentPractice.type];
            document.getElementById('practiceType').className = 'badge bg-secondary me-2';

            const optionsHtml = Object.entries(currentPractice.options).map(([key, value]) => `
                <div class="form-check mb-2 p-3 border rounded" style="cursor: pointer;" onclick="selectPracticeOption('${key}')">
                    <input class="form-check-input" type="radio" name="practiceOption" id="option${key}" value="${key}">
                    <label class="form-check-label w-100" for="option${key}">
                        <strong>${key}.</strong> ${value}
                    </label>
                </div>
            `).join('');

            document.getElementById('practiceQuestion').innerHTML = `
                <p class="question-text mb-3">${currentPractice.content}</p>
                ${currentPractice.type === 'multi' ? '<p class="text-muted small">（多选题）</p>' : ''}
                <div class="options-container">
                    ${optionsHtml}
                </div>
            `;
        }

        function selectPracticeOption(option) {
            document.querySelectorAll('[name="practiceOption"]').forEach(el => {
                el.checked = (el.value === option);
            });
            selectedAnswer = option;
        }

        async function submitPracticeAnswer() {
            if (!selectedAnswer || !currentPractice) {
                alert('请选择答案');
                return;
            }

            const res = await fetch('/api/answer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question_id: currentPractice.id,
                    answer: selectedAnswer
                })
            });

            const data = await res.json();

            practiceModal.hide();

            if (data.is_correct) {
                document.getElementById('resultTitle').innerHTML =
                    '<i class="bi bi-check-circle text-success me-2"></i>回答正确';
                document.getElementById('resultMessage').innerHTML =
                    '<p class="text-success">恭喜！此题目已从错题本移除</p>';
                document.getElementById('explanationArea').style.display = 'none';

                // 从错题本移除
                await fetch(`/api/wrongbook/${currentPractice.id}`, { method: 'DELETE' });
                loadWrongbook();
            } else {
                document.getElementById('resultTitle').innerHTML =
                    '<i class="bi bi-x-circle text-danger me-2"></i>回答错误';
                document.getElementById('resultMessage').innerHTML = `
                    <p class="text-danger">正确答案是：<strong>${data.correct_answer}</strong></p>
                    <p>你的答案是：<strong>${data.user_answer}</strong></p>
                `;
                document.getElementById('explanationText').textContent =
                    data.explanation || '暂无解析';
                document.getElementById('explanationArea').style.display = 'block';
            }

            resultModal.show();
        }

        function continuePractice() {
            resultModal.hide();
            loadWrongbook();
        }

        async function removeQuestion(questionId) {
            if (!confirm('确定要移除此题吗？')) return;

            await fetch(`/api/wrongbook/${questionId}`, { method: 'DELETE' });
            loadWrongbook();
        }

        async function cleanWrongbook() {
            if (!confirm('确定要清空所有错题吗？此操作不可恢复！')) return;

            await fetch('/api/wrongbook/clean', { method: 'POST' });
            loadWrongbook();
        }

        function practiceAll() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
